<!-- Login | The Editorial -->
<!DOCTYPE html>
<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>The Editorial - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed": "#1c1b1c", "on-tertiary-container": "#a27e3b", "on-tertiary-fixed-variant": "#5e4100",
                        "surface-bright": "#faf9f6", "primary": "#000000", "surface-tint": "#5f5e5f", "primary-fixed": "#e5e2e3",
                        "primary-container": "#1c1b1c", "secondary": "#5d5f5e", "on-secondary-container": "#616362", "on-secondary": "#ffffff",
                        "outline": "#77777b", "on-primary-container": "#858384", "surface-container-high": "#e9e8e5", "surface": "#faf9f6",
                        "on-surface-variant": "#46464a", "tertiary": "#000000", "secondary-fixed-dim": "#c6c7c6", "background": "#faf9f6",
                        "tertiary-fixed": "#ffdea9", "surface-dim": "#dbdad7", "surface-container": "#efeeeb", "surface-variant": "#e3e2df",
                        "primary-fixed-dim": "#c8c6c7", "surface-container-low": "#f5f3f0", "on-error-container": "#93000a", "on-background": "#1b1c1a",
                        "surface-container-highest": "#e3e2df", "inverse-on-surface": "#f2f1ed", "on-tertiary": "#ffffff", "secondary-fixed": "#e2e2e2",
                        "surface-container-lowest": "#ffffff", "tertiary-container": "#271900", "on-secondary-fixed": "#1a1c1c", "tertiary-fixed-dim": "#ebc076",
                        "on-error": "#ffffff", "inverse-primary": "#c8c6c7", "on-secondary-fixed-variant": "#454747", "on-primary-fixed-variant": "#474647",
                        "inverse-surface": "#30312f", "error": "#ba1a1a", "on-surface": "#1b1c1a", "on-tertiary-fixed": "#271900",
                        "outline-variant": "#c7c6ca", "secondary-container": "#dfe0df", "on-primary": "#ffffff", "error-container": "#ffdad6"
                    },
                    "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                    "spacing": { "md": "24px", "lg": "48px", "xl": "80px", "base": "8px", "xs": "4px", "container-max": "1280px", "article-max": "680px", "sm": "12px" },
                    "fontFamily": {
                        "meta-caps": ["Inter"], "headline-md": ["\"Source Serif 4\""], "headline-lg": ["\"Source Serif 4\""],
                        "ui-label-lg": ["Inter"], "article-body": ["\"Source Serif 4\""], "ui-label-md": ["Inter"],
                        "ui-label-sm": ["Inter"], "display-lg": ["\"Source Serif 4\""]
                    },
                    "fontSize": {
                        "meta-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "ui-label-lg": ["16px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "article-body": ["18px", { "lineHeight": "30px", "fontWeight": "400" }],
                        "ui-label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "ui-label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .paper-grain {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            background-color: #FAFAF9;
        }
        .floating-label-group { position: relative; }
        .floating-label-input {
            width: 100%; padding: 24px 16px 8px 16px; background-color: white; border: 1px solid #E5E4E1;
            border-radius: 8px; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.1); outline: none;
        }
        .floating-label-input:focus { border-color: #0B0B0C; box-shadow: inset 0 0 0 1px #0B0B0C; }
        .floating-label {
            position: absolute; left: 16px; top: 16px; color: #77777b; transition: all 0.2s ease-out;
            pointer-events: none; transform-origin: left top;
        }
        .floating-label-input:focus ~ .floating-label,
        .floating-label-input:not(:placeholder-shown) ~ .floating-label {
            transform: translateY(-8px) scale(0.85); color: #1b1c1a;
        }
        .btn-press { transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.1), background-color 0.2s ease; }
        .btn-press:active { transform: scale(0.97); }
        .totp-container {
            max-height: 0; overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.1), opacity 0.4s ease; opacity: 0;
        }
        .totp-container.expanded { max-height: 120px; opacity: 1; margin-top: 16px; }
    </style>
</head>
<body class="h-full paper-grain flex items-center justify-center p-md text-on-surface">
<div class="w-full max-w-[420px] bg-surface-bright rounded-lg border border-outline-variant p-lg shadow-[0_4px_12px_rgba(0,0,0,0.02)]">
<div class="text-center mb-lg">
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight mb-xs">The Editorial</h1>
<p class="font-ui-label-md text-ui-label-md text-on-surface-variant">Sign in to the author console.</p>
</div>
<form class="flex flex-col gap-md" id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
<div class="flex flex-col gap-md" id="primary-credentials">
<div class="floating-label-group">
<input class="floating-label-input font-ui-label-md text-ui-label-md text-on-surface" id="email" placeholder=" " required="" type="email"/>
<label class="floating-label font-ui-label-sm text-ui-label-sm" for="email">Email address</label>
</div>
<div class="floating-label-group">
<input class="floating-label-input font-ui-label-md text-ui-label-md text-on-surface" id="password" placeholder=" " required="" type="password"/>
<label class="floating-label font-ui-label-sm text-ui-label-sm" for="password">Password</label>
</div>
</div>
<div class="totp-container" id="totp-section">
<p class="font-ui-label-sm text-ui-label-sm text-on-surface-variant mb-base">Enter the 6-digit code from your authenticator app.</p>
<div class="floating-label-group">
<input class="floating-label-input font-ui-label-md text-ui-label-md text-on-surface text-center tracking-[0.5em]" id="totp" maxlength="6" pattern="\d{6}" placeholder=" " type="text"/>
<label class="floating-label font-ui-label-sm text-ui-label-sm" for="totp">Auth Code</label>
</div>
</div>
<div class="flex items-center justify-between mt-xs">
<label class="flex items-center gap-xs cursor-pointer group">
<input class="rounded border-outline-variant text-primary focus:ring-primary focus:ring-offset-0 w-4 h-4 transition-colors" type="checkbox"/>
<span class="font-ui-label-sm text-ui-label-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
<a class="font-ui-label-sm text-ui-label-sm text-on-surface-variant hover:text-primary transition-colors underline decoration-outline-variant underline-offset-4 hover:decoration-primary" href="#">Forgot password?</a>
</div>
<button class="w-full bg-[#0B0B0C] text-[#FAFAF9] font-ui-label-md text-ui-label-md py-sm rounded-lg btn-press mt-base" id="submit-btn" type="submit">
                Continue
            </button>
</form>
<div class="mt-lg pt-md border-t border-outline-variant text-center">
<p class="font-ui-label-sm text-ui-label-sm text-on-surface-variant">
                Request an invitation to <a class="text-primary hover:underline underline-offset-4" href="#">publish with us</a>.
            </p>
</div>
</div>
<script>
        let step = 1;
        const totpSection = document.getElementById('totp-section');
        const submitBtn = document.getElementById('submit-btn');
        const primaryInputs = document.querySelectorAll('#primary-credentials input');
        function handleLogin() {
            if (step === 1) {
                submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-sm">progress_activity</span>';
                submitBtn.disabled = true;
                setTimeout(() => {
                    totpSection.classList.add('expanded');
                    submitBtn.innerText = 'Verify & Sign In';
                    submitBtn.disabled = false;
                    document.getElementById('totp').required = true;
                    document.getElementById('totp').focus();
                    primaryInputs.forEach(input => {
                        input.readOnly = true;
                        input.classList.add('bg-surface-container-low', 'text-on-surface-variant');
                    });
                    step = 2;
                }, 800);
            } else {
                submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-sm">progress_activity</span>';
                submitBtn.disabled = true;
                setTimeout(() => {
                    submitBtn.innerText = 'Success';
                    submitBtn.classList.replace('bg-[#0B0B0C]', 'bg-secondary');
                }, 1000);
            }
        }
    </script>
</body></html>
