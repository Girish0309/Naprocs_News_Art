<style>
        .shimmer {
            background: linear-gradient(90deg, #efeeeb 25%, #e3e2df 50%, #efeeeb 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        .progress-bar-ease { transition: width 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.1); }

<body class="bg-background text-on-background antialiased min-h-screen flex flex-col items-center justify-center p-md">
<header class="fixed top-0 z-50 flex justify-between items-center w-full px-lg py-sm bg-surface dark:bg-surface-container-highest border-b border-outline-variant dark:border-outline transition-all duration-200 ease-in-out">
<div class="font-headline-lg text-headline-lg text-primary dark:text-on-primary-fixed tracking-tight">The Editorial</div>
<div class="flex items-center gap-md">
<button class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-container-high transition-colors duration-200 p-xs rounded-full">
<span class="material-symbols-outlined">notifications</span>
</button>
<div class="w-8 h-8 rounded-full bg-surface-container-high overflow-hidden border border-outline-variant">
<img class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAzyFmf-MD2fD2vYpKJ2TDFLZyeIPN0jPGV7kojDjbVs56AglShaw847Pz4Gk2JWQdSh3G4B0fjnurq9bxvDZPS_IhDuXTv74KZOa0lRiJ1rrJcbcG8wekZDc4HZ6hwOs9CXO-4Qt1K8JG0kZyASLc1-XHwuBzbVxNN4lXqhGN1hH6NqbErL6GQSAOv-fZdKZ8FEXT0lIvScfI_I-snDXcu79NCZs59g-7L-ofk-A1SILyJoMHMJww"/>
</div>
</div>
</header>
<main class="w-full max-w-article-max mt-xl flex flex-col gap-lg">
<section class="w-full flex flex-col gap-sm" id="upload-state">
<div class="font-ui-label-lg text-ui-label-lg text-on-surface">Cover Artwork</div>
<p class="font-ui-label-sm text-ui-label-sm text-on-surface-variant">Drag and drop high-resolution JPG or PNG. Minimum dimensions: 1440x900px.</p>
<div class="relative w-full h-64 border-2 border-dashed border-outline-variant hover:border-primary hover:bg-surface-container-low transition-colors duration-300 rounded-lg flex flex-col items-center justify-center cursor-pointer group">
<span class="material-symbols-outlined text-4xl text-on-surface-variant group-hover:text-primary transition-colors duration-200 mb-sm">cloud_upload</span>
<div class="font-ui-label-md text-ui-label-md text-on-surface">Select a file or drag and drop here</div>
<div class="font-ui-label-sm text-ui-label-sm text-on-surface-variant mt-xs">JPG, PNG, TIFF up to 10MB</div>
<input class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="startUpload()" type="file"/>
</div>
</section>
<section class="w-full flex flex-col gap-sm hidden" id="progress-state">
<div class="flex justify-between items-end mb-xs">
<div class="font-ui-label-md text-ui-label-md text-on-surface">Uploading hero_image_v3.jpg...</div>
<div class="font-ui-label-sm text-ui-label-sm text-on-surface-variant" id="progress-text">0%</div>
</div>
<div class="w-full h-2 bg-surface-container-highest rounded-full overflow-hidden border border-outline-variant">
<div class="h-full bg-primary progress-bar-ease w-0 rounded-full" id="progress-bar"></div>
</div>
</section>
<section class="w-full hidden" id="processing-state">
<div class="w-full rounded-lg border border-outline-variant bg-surface overflow-hidden">
<div class="relative w-full h-64 bg-surface-container-low">
<div class="absolute inset-0 shimmer opacity-80 z-10 transition-opacity duration-500" id="shimmer-overlay"></div>
<img class="w-full h-full object-cover filter grayscale blur-sm transition-all duration-1000" id="preview-image" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD0rDkWm8tMGXnXwgyngfxs2SDatO7kSCK0e0Jo4Cz42ZnPAo7Sd5B7LboHEXmvEbMJWoeYSF3t9RRTqBNR_BF7IsGR0Car36aWPNKRA3OnBZzf6CcGWMBAMtT3C29w2TpkMU7DFvSrvJXEghHtVeNGc3PSff9xcH9DaB8BtJPix5ktIfSbFX8yrs1W3m48KCC7MePOrClfoRMN7GnpnLoQ4oSOORrSBGgICuOHiXU7G0BkSdqGo1w"/>
</div>
<div class="p-md flex items-center justify-between border-t border-outline-variant bg-surface-bright">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-outline-variant animate-pulse" id="status-icon">policy</span>
<div class="flex flex-col">
<span class="font-ui-label-md text-ui-label-md text-on-surface" id="status-title">Security &amp; Integrity Scan</span>
<span class="font-ui-label-sm text-ui-label-sm text-on-surface-variant" id="status-desc">Verifying file signature and metadata...</span>
</div>
</div>
<button class="font-ui-label-md text-ui-label-md text-primary hover:text-on-surface-variant transition-colors" onclick="resetDemo()">Cancel</button>
</div>
</div>
</section>
</main>
<script>
        function startUpload() {
            document.getElementById('upload-state').classList.add('hidden');
            document.getElementById('progress-state').classList.remove('hidden');
            let progress = 0;
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');
            const interval = setInterval(() => {
                const increment = progress > 70 ? Math.random() * 5 : Math.random() * 20;
                progress += increment;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    setTimeout(startProcessing, 500);
                }
                progressBar.style.width = `${progress}%`;
                progressText.innerText = `${Math.floor(progress)}%`;
            }, 300);
        }
        function startProcessing() {
            document.getElementById('progress-state').classList.add('hidden');
            document.getElementById('processing-state').classList.remove('hidden');
            setTimeout(() => {
                const shimmer = document.getElementById('shimmer-overlay');
                const img = document.getElementById('preview-image');
                const icon = document.getElementById('status-icon');
                const title = document.getElementById('status-title');
                const desc = document.getElementById('status-desc');
                shimmer.classList.add('opacity-0');
                img.classList.remove('grayscale', 'blur-sm');
                icon.classList.remove('animate-pulse', 'text-outline-variant');
                icon.classList.add('text-primary');
                icon.innerText = 'verified_user';
                title.innerText = 'Asset Verified';
                desc.innerText = 'Ready for publication.';
            }, 3000);
        }
        function resetDemo() {
            document.getElementById('upload-state').classList.remove('hidden');
            document.getElementById('progress-state').classList.add('hidden');
            document.getElementById('processing-state').classList.add('hidden');
            document.getElementById('progress-bar').style.width = '0%';
            document.getElementById('progress-text').innerText = '0%';
            document.getElementById('shimmer-overlay').classList.remove('opacity-0');
            document.getElementById('preview-image').classList.add('grayscale', 'blur-sm');
            const icon = document.getElementById('status-icon');
            icon.classList.add('animate-pulse', 'text-outline-variant');
            icon.classList.remove('text-primary');
            icon.innerText = 'policy';
            document.getElementById('status-title').innerText = 'Security & Integrity Scan';
            document.getElementById('status-desc').innerText = 'Verifying file signature and metadata...';
        }
    </script>
</body></html>
